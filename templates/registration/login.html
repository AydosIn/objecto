{% extends "base.html" %}

{% block title %}Log in · Object Biographies{% endblock %}

{% block content %}
<section class="panel">
  <h1>Welcome back</h1>
  <p class="panel__lead">Your objects have been talking about you.</p>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn--block">Log in</button>
  </form>
  <p class="panel__links">
    <a href="{% url 'password_reset' %}">Forgot your password?</a><br>
    New here? <a href="{% url 'signup' %}">Open your museum</a>
  </p>
</section>
{% endblock %}
