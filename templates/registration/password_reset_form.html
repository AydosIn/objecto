{% extends "base.html" %}

{% block title %}Reset password · Object Biographies{% endblock %}

{% block content %}
<section class="panel">
  <h1>Reset your password</h1>
  <p class="panel__lead">Enter your email and we'll send you a link to choose a new password.</p>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn--block">Send reset link</button>
  </form>
  <p class="panel__links"><a href="{% url 'login' %}">Back to log in</a></p>
</section>
{% endblock %}
